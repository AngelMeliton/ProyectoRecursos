<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Game Quiz</title>
</head>
<body>
    <div class="container">
        <img src="img/ESCUDOP3.png" alt="" class="img">
        <header>
            <div class="puntaje">
                <img src="img/puntos.png" alt="">
                <span class="puntos" id="puntos">0</span>
            </div>
            <h1>QUIZ</h1>
            <div class="jugador">
                <span class="nombre" id="nombre">Potrohermano</span>
                <img src="img/potrouser.png" alt="">
            </div>
        </header>

        <!-- SECCIÓN MENU DEL JUEGO -->
        <main class="menu">
            <h2>Hola <span id="nombre-jugador">Potrohermano</span></h2>
            <p>Elige una categoría..</p>
            <div class="categorias">
                <div class="categoria" id="Definición y conceptos">
                    <img src="img/ciberbullynig" alt="" class="foto-categoria">
                    <h3>Definición y conceptos</h3>
                </div>
                <div class="categoria" id="Formas y plataformas">
                    <img src="img/plataformas" alt="" class="foto-categoria">
                    <h3>Formas y plataformas</h3>
                </div>
                <div class="categoria" id="Impacto en la salud mental y el rendimiento académico">
                    <img src="img/impacto" alt="" class="foto-categoria">
                    <h3>Impacto en la salud mental y el rendimiento académico</h3>
                </div>
                <div class="categoria" id="Señales y detección">
                    <img src="img/señales" alt="" class="foto-categoria">
                    <h3>Señales y detección</h3>
                </div>
                <div class="categoria" id="Prevención y apoyo">
                    <img src="img/prevención" alt="" class="foto-categoria">
                    <h3>Prevención y apoyo</h3>
                </div>
                <div class="categoria" id="Regulación y políticas">
                    <img src="img/politicas" alt="" class="foto-categoria">
                    <h3>Regulación y políticas</h3>
                </div>
            </div>
        </main>
    </div>

    <script src="js/menu.js"></script>
</body>
</html>
